name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build
        run: nix build .

      - name: Prepare assets
        run: |
          mkdir -p dist
          cp -R result/bin/* dist/ 2>/dev/null || true
          ls -l dist || true

      - name: Sign builds
        if: ${{ false }}
        run: |
          echo "Signing step is not enabled yet."
          exit 0

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
